name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Scan dependencies, code, and secrets
        shell: pwsh
        run: ./scripts/Test-Security.ps1 -OutputDirectory artifacts/security-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            artifacts/security-report/*.json
            artifacts/security-report/*.sarif
