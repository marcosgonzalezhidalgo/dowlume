name: Package Windows candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build tested release packages
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Dowlume-0.1.0-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
