name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore Dowlume/Dowlume.slnx
      - run: dotnet build Dowlume/Dowlume.slnx -c Release --no-restore
      - run: dotnet test Dowlume/Dowlume.slnx -c Release --no-build --filter "Category!=WindowsShell" --logger trx
      - run: dotnet format Dowlume/Dowlume.slnx --verify-no-changes --no-restore
      - run: dotnet build scripts/FileOperationAcceptance -c Release
      - run: dotnet format scripts/FileOperationAcceptance/FileOperationAcceptance.csproj --verify-no-changes --no-restore
      - name: Test read-only Recycle Bin evidence inventory
        shell: powershell
        run: ./scripts/Test-RecycleEvidenceInventory.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
